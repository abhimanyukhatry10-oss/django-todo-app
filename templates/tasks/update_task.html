{% extends 'base.html' %}

{% block title %}
Update Task
{% endblock %}

{% block content %}

<h2>Update Task</h2>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">
            Title
        </label>

        {{ form.title }}
    </div>

    <div class="mb-3">
        <label class="form-label">
            Description
        </label>

        {{ form.description }}
    </div>

    <div class="form-check mb-3">

        {{ form.completed }}

        <label class="form-check-label">
            Completed
        </label>

    </div>

    <button class="btn btn-primary">

        Update Task

    </button>

</form>

{% endblock %}
