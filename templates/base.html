
<!DOCTYPE html> <!--Ye browser ko batata hai: "Ye HTML5 document hai."-->
<html lang="en">

<head>
    <meta charset="UTF-8"><!--Browser ko batata hai ki page ka text UTF-8 character encoding use karta hai.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Browser ko bolo ki page ki width device ki actual screen width ke according rakho.-->

    <title>
        {% block title %}
            To-Do App
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'add_task' %}">
            <i class="bi bi-check2-square"></i><!--bi -> Ye Bootstrap Icons ki base class hai./////////bi-check2-square - Ye specific icon ki class hai.-->
            Django To-Do App
        </a>

        <button
            class="navbar-toggler" 
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"><!--class="navbar-toggler" Bootstrap class hai; mobile navbar ka toggle button style karti hai.
            data-bs-target -> Bootstrap ko batata hai ki kis element ko collapse/expand karna hai.
            -->

            <span class="navbar-toggler-icon"></span>
<!--navbar-toggler-icon Bootstrap ki class hai jo button ke andar hamburger/menu icon (☰) dikhati hai.-->
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <!--<div> ka use webpage ke elements ko ek group/container me rakhne ke liye hota hai.-->
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item me-lg-3">

                    <span class="navbar-text">

                        <i class="bi bi-person-circle"></i>

                        Welcome,

                        <strong>{{ request.user.username }}</strong>

                    </span>

                </li>

                <li class="nav-item">

                    <a href="{% url 'logout' %}"

                       class="btn btn-outline-light btn-sm">

                        <i class="bi bi-box-arrow-right"></i>

                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

{% if messages %}

    {% for message in messages %}

        <div class="alert alert-success alert-dismissible fade show" role="alert">

            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>

        </div>

    {% endfor %}

{% endif %}
<div class="container mt-4">

    {% block content %}

    {% endblock %}

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
